// SPDX-License-Identifier: Apache-2.0

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

group = 'com.moonlight.haptics'
version = (findProperty('sdkVersion') ?: '0.7.0-SNAPSHOT').toString()

android {
    namespace 'com.moonlight.haptics.android'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 22
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow'
            }
        }
    }

    buildFeatures {
        buildConfig false
        prefabPublishing true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    prefab {
        moonlight_haptics_android {
            headers 'src/main/cpp/include'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = 'moonlight-haptics-android'
            version = project.version

            pom {
                name = 'Moonlight Audio Haptics Android'
                description = 'Portable real-time audio-to-haptics SDK and Android renderer'
                url = 'https://github.com/AlkaidLab/moonlight-audio-haptics'
                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                    license {
                        name = 'BSD 3-Clause License (bundled libfvad source)'
                        url = 'https://opensource.org/license/bsd-3-clause'
                        distribution = 'repo'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/AlkaidLab/moonlight-audio-haptics.git'
                    developerConnection = 'scm:git:ssh://git@github.com/AlkaidLab/moonlight-audio-haptics.git'
                    url = 'https://github.com/AlkaidLab/moonlight-audio-haptics'
                }
            }

            afterEvaluate {
                from components.release
            }
        }
    }
}

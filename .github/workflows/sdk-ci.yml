name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    name: Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Check version declarations
        run: python tools/check_version.py .

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install CMake package
        run: cmake --install build --config Release --prefix install

      - name: Configure package consumer
        run: cmake -S tests/package_consumer -B consumer-build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build package consumer
        run: cmake --build consumer-build --config Release

  android:
    name: Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: platform/android/**/*.gradle*

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358

      - name: Build and test AAR
        run: |
          chmod +x platform/android/gradlew
          ./platform/android/gradlew -p platform/android testDebugUnitTest lintRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: moonlight-haptics-android-snapshot
          path: platform/android/build/outputs/aar/*.aar
          if-no-files-found: error

name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    name: Host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Check version declarations
        run: python tools/check_version.py .

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install CMake package
        run: cmake --install build --config Release --prefix install

      - name: Configure package consumer
        run: cmake -S tests/package_consumer -B consumer-build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build package consumer
        run: cmake --build consumer-build --config Release

  android:
    name: Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: platform/android/**/*.gradle*

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358

      - name: Build and test AAR
        run: |
          chmod +x platform/android/gradlew
          ./platform/android/gradlew -p platform/android testDebugUnitTest lintRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: moonlight-haptics-android-snapshot
          path: platform/android/build/outputs/aar/*.aar
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build/sanitizers
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build/sanitizers

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure

  dialogue-corpus:
    name: Dialogue corpus (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download pinned libfvad speech fixture
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/dpirch/libfvad/532ab666c20d3cfda38bca63abbb0f152706c369/tests/data/audio_tiny16.wav"
          curl --fail --location --silent --show-error \
            "${url}" -o "${RUNNER_TEMP}/audio_tiny16.wav"
          echo "551d3f0282c5d5e1e32e76da97bd3532c38e6f4bb02a32510caf562d7c06ae9c  ${RUNNER_TEMP}/audio_tiny16.wav" \
            | sha256sum --check --strict

      - name: Configure
        run: >-
          cmake -S . -B build/corpus
          -DCMAKE_BUILD_TYPE=Release
          -DMOONLIGHT_HAPTICS_DIALOGUE_CORPUS_WAV="${RUNNER_TEMP}/audio_tiny16.wav"

      - name: Build corpus regression
        run: cmake --build build/corpus --target moonlight_haptics_dialogue_corpus_test

      - name: Test corpus regression
        run: >-
          ctest --test-dir build/corpus
          --output-on-failure
          --tests-regex moonlight_haptics_dialogue_corpus
